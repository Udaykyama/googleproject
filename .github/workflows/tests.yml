name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is pyproject's requires-python. Both projects are
        # stdlib-only, so a break here is a real incompatibility, not a
        # dependency-resolution artefact.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ".[dns]"

      - name: Run the full suite
        # `python -m pytest` rather than bare `pytest`: it puts the repository
        # root on sys.path, which is how `fake_review_detector` is imported.
        run: python -m pytest tests/ -q

      - name: Check the stdlib-only claim still holds
        # Both packages promise zero runtime dependencies. Importing them with
        # site-packages disabled proves it, rather than trusting the promise.
        run: |
          python -X importtime -S -c "
          import sys
          sys.path[:0] = ['.', 'src']
          import fake_review_detector, inboxready
          print('imported with site-packages disabled:', fake_review_detector.__name__, inboxready.__name__)
          "

  cli-smoke:
    # The tests exercise the library; this exercises the documented commands,
    # which is where README drift shows up first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Score, evaluate, and audit a batch
        run: |
          python -m fake_review_detector.cli score data/sample_reviews.json \
              --audit-log /tmp/decisions.jsonl --queue /tmp/queue.json
          python -m fake_review_detector.cli evaluate data/labelled_reviews.json
          python -m fake_review_detector.cli verify --audit-log /tmp/decisions.jsonl
          python -m fake_review_detector.cli replay data/sample_reviews.json \
              --audit-log /tmp/decisions.jsonl
          python -m fake_review_detector.cli queue --list --queue /tmp/queue.json

      - name: Calibration must refuse to recommend on thin data
        # `calibrate` exits non-zero when the evidence cannot justify moving the
        # threshold. On the 174-review set it never can, so a zero exit here
        # means the guard rails have been removed.
        run: |
          if python -m fake_review_detector.cli calibrate \
              data/labelled_reviews.json > /tmp/calibration.txt; then
            echo "calibrate recommended a change on 174 reviews; guard rails gone"
            cat /tmp/calibration.txt
            exit 1
          fi
          cat /tmp/calibration.txt
          grep -q "VERDICT" /tmp/calibration.txt
          python -m fake_review_detector.cli calibrate \
              data/labelled_reviews.json --json > /tmp/calibration.json || true
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/calibration.json"))
          assert payload["recommended"] is False, payload
          assert payload["precision_at_prevalence"]["0.05"] < 1.0, payload
          print("calibration guard rails intact")
          PY

      - name: Tampering must fail the build
        # A verifier that cannot fail is not a verifier. This asserts the
        # non-zero exit, so a regression that always returns 0 is caught.
        run: |
          python - <<'PY'
          import json
          lines = open("/tmp/decisions.jsonl").read().splitlines()
          record = json.loads(lines[1])
          record["decision"]["score"] = 0
          record["decision"]["action"] = "allow"
          lines[1] = json.dumps(record)
          open("/tmp/tampered.jsonl", "w").write("\n".join(lines) + "\n")
          PY
          if python -m fake_review_detector.cli verify --audit-log /tmp/tampered.jsonl; then
            echo "::error::verify accepted a tampered audit log"
            exit 1
          fi
          echo "tampered log correctly rejected"

      - name: Audit an example domain offline
        run: |
          python -m inboxready deals.example-shop.test \
              --fixture examples/fixtures/failing-sender.json \
              --selector google || test $? -eq 1
        env:
          PYTHONPATH: src

  web-smoke:
    # The web tests use Flask's test client, which bypasses the WSGI server.
    # This boots the real thing and talks to it over a socket, so a broken
    # deployment is caught here rather than after it is deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the package with the web extra
        # Installing rather than running from the checkout also proves the
        # templates and stylesheet are actually packaged.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[server]"

      - name: Boot the app
        run: |
          # Run outside the checkout so imports and demo assets must come from
          # the installed wheel, rather than accidentally passing from source.
          cd /tmp
          gunicorn --bind 127.0.0.1:8000 --workers 2 --threads 2 \
            --timeout 60 'webui:create_app()' > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null 2>&1; then
              echo "app is up"
              exit 0
            fi
            sleep 0.25
          done
          echo "::error::the app did not start"
          cat /tmp/webui.log
          exit 1
        env:
          SECRET_KEY: ci-smoke-test-not-a-real-secret-key
          STORAGE: sqlite
          DATA_DIR: /tmp/webui-data

      - name: Every page must render
        run: |
          for path in / /inbox /reviews /queue /healthz /readyz /static/style.css; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://127.0.0.1:8000$path")
            test "$code" = "200" || {
              echo "::error::$path returned $code"
              cat /tmp/body
              exit 1
            }
            echo "$path 200"
          done

      - name: A fixture audit must return the same verdict as the CLI
        # The web layer renders what the library returns. If those two ever
        # disagree, the UI is lying about a domain's compliance.
        run: |
          jar=/tmp/cookies
          token=$(curl -s -c $jar http://127.0.0.1:8000/inbox \
            | grep -o 'name="csrf_token" value="[^"]*"' \
            | head -1 | sed 's/.*value="//; s/"//')
          test -n "$token" || { echo "::error::no CSRF token rendered"; exit 1; }
          curl -s -b $jar -c $jar -o /tmp/audit.html \
            --data-urlencode "csrf_token=$token" \
            --data-urlencode "mode=fixture" \
            --data-urlencode "fixture=failing-sender" \
            --data-urlencode "domain=deals.example-shop.test" \
            --data-urlencode "selectors=google legacy" \
            --data-urlencode "ips=203.0.113.25" \
            --data-urlencode "daily_volume=1200000" \
            --data-urlencode "spam_rate=0.42" \
            http://127.0.0.1:8000/inbox
          grep -q "Score 0/100" /tmp/audit.html
          grep -q "SPF_TOO_MANY_LOOKUPS" /tmp/audit.html
          echo "audit matched the command-line verdict"

      - name: CLI and web workers must share the moderation queue
        run: |
          python -m fake_review_detector.cli score data/sample_reviews.json \
            --database /tmp/webui-data/moderation.sqlite3 --json > /tmp/scored.json
          python -c "import json; assert json.load(open('/tmp/scored.json'))['accepted'] == 6"
          curl -fsS http://127.0.0.1:8000/queue > /tmp/queue.html
          grep -q "r2" /tmp/queue.html
          python -m fake_review_detector.cli verify \
            --database /tmp/webui-data/moderation.sqlite3 --require-anchor
          python -m fake_review_detector.cli replay data/sample_reviews.json \
            --database /tmp/webui-data/moderation.sqlite3

      - name: A forged form must be rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --data-urlencode "domain=example.test" \
            http://127.0.0.1:8000/inbox)
          test "$code" = "400" || {
            echo "::error::a request with no CSRF token returned $code"
            exit 1
          }
          echo "CSRF check held"

      - name: Stop the app
        if: always()
        run: |
          if [ -f /tmp/webui.pid ]; then kill "$(cat /tmp/webui.pid)" || true; fi
          cat /tmp/webui.log || true

  infrastructure-validation:
    # Validation downloads the locked provider and creates an offline plan
    # with a fake token, but uses no backend, real credential, or apply.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: 1.12.6

      - name: Check formatting and validate without credentials
        run: |
          tofu fmt -check -recursive infrastructure
          tofu -chdir=infrastructure/digitalocean init \
            -backend=false -input=false -lockfile=readonly
          tofu -chdir=infrastructure/digitalocean validate -no-color

      - name: Exercise the no-credential plan and firewall invariants
        env:
          DIGITALOCEAN_TOKEN: ci-placeholder-not-a-real-token
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/inboxready.tfplan /tmp/inboxready-plan.json /tmp/no-public-ssh.tfplan /tmp/no-public-ssh.json /tmp/unsafe-plan.txt' EXIT
          tofu -chdir=infrastructure/digitalocean plan \
            -refresh=false -lock=false -input=false -no-color \
            -out=/tmp/inboxready.tfplan \
            -var='confirm_billable_resources=true' \
            -var='ssh_key_ids_or_fingerprints=["12345"]' \
            -var='operator_ssh_cidrs=["8.8.8.8/32"]' \
            > /dev/null
          tofu -chdir=infrastructure/digitalocean show \
            -json /tmp/inboxready.tfplan > /tmp/inboxready-plan.json
          python3 - <<'PY'
          import json

          plan = json.load(open("/tmp/inboxready-plan.json"))
          resources = {
              resource["address"]: resource["values"]
              for resource in plan["planned_values"]["root_module"]["resources"]
          }
          assert set(resources) == {
              "digitalocean_droplet.app",
              "digitalocean_firewall.app",
              "digitalocean_project.app",
              "digitalocean_tag.app",
          }, resources
          droplet = resources["digitalocean_droplet.app"]
          assert droplet["image"] == "ubuntu-24-04-x64", droplet
          assert droplet["backups"] is True, droplet
          assert droplet["monitoring"] is True, droplet
          assert droplet["ipv6"] is False, droplet
          firewall = resources["digitalocean_firewall.app"]
          inbound = firewall["inbound_rule"]
          assert len(inbound) == 1, inbound
          assert inbound[0]["protocol"] == "tcp", inbound
          assert inbound[0]["port_range"] == "22", inbound
          assert inbound[0]["source_addresses"] == [
              "8.8.8.8/32"
          ], inbound
          assert not {"80", "443", "8000"} & {
              rule.get("port_range") for rule in inbound
          }, inbound
          print("offline infrastructure plan invariants passed")
          PY
          if tofu -chdir=infrastructure/digitalocean plan \
            -refresh=false -lock=false -input=false -no-color \
            -var='confirm_billable_resources=true' \
            -var='ssh_key_ids_or_fingerprints=["12345"]' \
            -var='operator_ssh_cidrs=["0.0.0.0/0"]' \
            > /tmp/unsafe-plan.txt 2>&1; then
            echo "::error::unsafe public SSH CIDR unexpectedly passed planning"
            exit 1
          fi
          grep -q "operator_ssh_cidrs must contain IPv4 /24-/32" \
            /tmp/unsafe-plan.txt
          tofu -chdir=infrastructure/digitalocean plan \
            -refresh=false -lock=false -input=false -no-color \
            -out=/tmp/no-public-ssh.tfplan \
            -var='confirm_billable_resources=true' \
            -var='ssh_key_ids_or_fingerprints=["12345"]' \
            -var='disable_public_ssh=true' \
            -var='operator_ssh_cidrs=[]' \
            > /dev/null
          tofu -chdir=infrastructure/digitalocean show \
            -json /tmp/no-public-ssh.tfplan > /tmp/no-public-ssh.json
          python3 - <<'PY'
          import json

          plan = json.load(open("/tmp/no-public-ssh.json"))
          resources = {
              resource["address"]: resource["values"]
              for resource in plan["planned_values"]["root_module"]["resources"]
          }
          assert resources["digitalocean_firewall.app"]["inbound_rule"] == []
          print("post-bootstrap public SSH removal passed")
          PY

  deployment-smoke:
    # Exercise the same image, Compose file, hardening, readiness, and backup
    # command an operator will use on a fresh VPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Required production settings must fail closed
        run: |
          if env -u APP_IMAGE -u SECRET_KEY -u APP_DATA_DIR -u BACKUP_DIR \
              docker compose --project-name inboxready \
                --file compose.yaml config --quiet; then
            echo "::error::Compose accepted missing production settings"
            exit 1
          fi

      - name: Prepare smoke-only persistent paths
        run: |
          sudo install -d -o 10001 -g 10001 -m 0700 \
            /tmp/inboxready-data /tmp/inboxready-backups
          install -m 0600 /dev/null /tmp/inboxready-production.env
          cat > /tmp/inboxready-production.env <<'EOF'
          APP_IMAGE=ghcr.io/udaykyama/googleproject@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_DATA_DIR=/tmp/inboxready-data
          BACKUP_DIR=/tmp/inboxready-backups
          SECRET_KEY=ci-deployment-smoke-only-not-a-production-secret
          APP_PORT=8000
          GUNICORN_WORKERS=2
          GUNICORN_THREADS=2
          LIVE_DNS=0
          LOG_FORMAT=json
          LOG_LEVEL=INFO
          LOG_CLIENT_ADDRESS=0
          EOF
          cp /tmp/inboxready-production.env /tmp/inboxready-local.env
          sed -i \
            's|^APP_IMAGE=.*|APP_IMAGE=inboxready:local|' \
            /tmp/inboxready-local.env

      - name: Render the production Compose model
        run: |
          APP_IMAGE=ghcr.io/udaykyama/googleproject:mutable \
          APP_DATA_DIR=/tmp/untrusted-data \
          BACKUP_DIR=/tmp/untrusted-backups \
          SECRET_KEY=untrusted-exported-secret \
          COMPOSE_FILE=compose.local.yaml \
          COMPOSE_PROJECT_NAME=untrusted-project \
            deploy/production-compose \
              --env-file /tmp/inboxready-production.env config
          docker compose --project-name inboxready --file compose.yaml \
            --env-file /tmp/inboxready-production.env config \
            > /tmp/inboxready-compose.yaml
          docker compose --project-name inboxready --file compose.yaml \
            --env-file /tmp/inboxready-production.env config --format json \
            > /tmp/inboxready-compose.json
          grep -q "host_ip: 127.0.0.1" /tmp/inboxready-compose.yaml
          grep -q "read_only: true" /tmp/inboxready-compose.yaml
          grep -q "no-new-privileges:true" /tmp/inboxready-compose.yaml
          python - <<'PY'
          import json
          service = json.load(open("/tmp/inboxready-compose.json"))["services"]["app"]
          assert service["image"].startswith(
              "ghcr.io/udaykyama/googleproject@sha256:"
          ), service["image"]
          assert "build" not in service, service
          assert service["logging"]["driver"] == "json-file", service["logging"]
          assert service["logging"]["options"] == {
              "max-file": "5", "max-size": "10m"
          }, service["logging"]
          assert not any("--access-logfile" in item for item in service["command"])
          assert "--logger-class=webui.gunicorn.SafeGunicornLogger" in service["command"]
          print("bounded logging model rendered")
          PY

      - name: Build the production image
        run: |
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env build --pull

      - name: Image must be installed, non-root, and keep both CLIs
        run: |
          docker run --rm --entrypoint python inboxready:local -c "
          import importlib.resources, os
          from pathlib import Path
          assert os.getuid() == 10001
          assert (importlib.resources.files('webui') / 'templates' / 'index.html').is_file()
          assert not Path('/opt/inboxready/pyproject.toml').exists()
          "
          docker run --rm --entrypoint inboxready inboxready:local --help
          docker run --rm --entrypoint fake-review-detector inboxready:local --help

      - name: Start and back up the hardened service
        run: |
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env up -d --wait
          curl -fsS -D /tmp/ready-headers \
            -H 'X-Request-ID: ci-ready-check' \
            'http://127.0.0.1:8000/readyz?private-marker=must-not-log' \
            > /tmp/ready-body
          grep -qi '^X-Request-ID: ci-ready-check' /tmp/ready-headers
          python - <<'PY'
          import socket
          import time
          with socket.create_connection(("127.0.0.1", 8000), timeout=3) as client:
              client.sendall(
                  b"GET /parser-query-marker?token=parser-secret HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"X-Invalid: header-marker\x00\r\n"
                  b"Connection: close\r\n\r\n"
              )
              response = client.recv(1024)
          assert b" 400 " in response.splitlines()[0], response
          time.sleep(0.1)
          PY
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env logs --no-color app \
            > /tmp/inboxready-app.log
          grep -q '"event":"http.request"' /tmp/inboxready-app.log
          grep -q '"request_id":"ci-ready-check"' /tmp/inboxready-app.log
          grep -q '"route":"/readyz"' /tmp/inboxready-app.log
          grep -q '"event":"gunicorn.invalid_request"' /tmp/inboxready-app.log
          for marker in must-not-log parser-query-marker parser-secret header-marker; do
            if grep -q "$marker" /tmp/inboxready-app.log; then
              echo "::error::request-derived content reached production logs"
              exit 1
            fi
          done
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env exec -T app \
            fake-review-detector backup \
              --database /var/lib/inboxready/moderation.sqlite3 \
              --output-dir /var/backups/inboxready \
              --keep 2
          backup=$(sudo find /tmp/inboxready-backups -maxdepth 1 -type f \
            -name 'moderation-*.sqlite3' -print -quit)
          test -n "$backup"
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env exec -T app \
            fake-review-detector verify \
              --database "/var/backups/inboxready/$(basename "$backup")" \
              --integrity --require-anchor
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env \
            run --rm --no-deps -T app \
            fake-review-detector operational-check \
              --readiness-url http://app:8000/readyz \
              --data-dir /var/lib/inboxready \
              --backup-dir /var/backups/inboxready \
              --min-free-bytes 0 \
              --min-free-percent 0 \
              --max-backup-age 86400 \
              > /tmp/inboxready-operations.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/inboxready-operations.json"))
          assert payload["status"] == "ok", payload
          assert [item["code"] for item in payload["checks"]] == [
              "ready",
              "disk_space_available",
              "backup_recent",
              "backup_verified",
          ], payload
          print("operational check passed")
          PY

      - name: Stop the deployment
        if: always()
        run: |
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env logs || true
          docker compose --project-name inboxready \
            -f compose.yaml -f compose.local.yaml \
            --env-file /tmp/inboxready-local.env down || true
