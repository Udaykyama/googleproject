name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is pyproject's requires-python. Both projects are
        # stdlib-only, so a break here is a real incompatibility, not a
        # dependency-resolution artefact.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the full suite
        # `python -m pytest` rather than bare `pytest`: it puts the repository
        # root on sys.path, which is how `fake_review_detector` is imported.
        run: python -m pytest tests/ -q

      - name: Check the stdlib-only claim still holds
        # Both packages promise zero runtime dependencies. Importing them with
        # site-packages disabled proves it, rather than trusting the promise.
        run: |
          python -X importtime -S -c "
          import sys, pathlib
          sys.path[:0] = ['.', 'src']
          import fake_review_detector, inboxready
          print('imported with site-packages disabled:', fake_review_detector.__name__, inboxready.__name__)
          "

  cli-smoke:
    # The tests exercise the library; this exercises the documented commands,
    # which is where README drift shows up first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Score, evaluate, and audit a batch
        run: |
          python -m fake_review_detector.cli score data/sample_reviews.json \
              --audit-log /tmp/decisions.jsonl --queue /tmp/queue.json
          python -m fake_review_detector.cli evaluate data/labelled_reviews.json
          python -m fake_review_detector.cli verify --audit-log /tmp/decisions.jsonl
          python -m fake_review_detector.cli replay data/sample_reviews.json \
              --audit-log /tmp/decisions.jsonl
          python -m fake_review_detector.cli queue --list --queue /tmp/queue.json

      - name: Calibration must refuse to recommend on thin data
        # `calibrate` exits non-zero when the evidence cannot justify moving the
        # threshold. On the 174-review set it never can, so a zero exit here
        # means the guard rails have been removed.
        run: |
          if python -m fake_review_detector.cli calibrate \
              data/labelled_reviews.json > /tmp/calibration.txt; then
            echo "calibrate recommended a change on 174 reviews; guard rails gone"
            cat /tmp/calibration.txt
            exit 1
          fi
          cat /tmp/calibration.txt
          grep -q "VERDICT" /tmp/calibration.txt
          python -m fake_review_detector.cli calibrate \
              data/labelled_reviews.json --json > /tmp/calibration.json || true
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/calibration.json"))
          assert payload["recommended"] is False, payload
          assert payload["precision_at_prevalence"]["0.05"] < 1.0, payload
          print("calibration guard rails intact")
          PY

      - name: Tampering must fail the build
        # A verifier that cannot fail is not a verifier. This asserts the
        # non-zero exit, so a regression that always returns 0 is caught.
        run: |
          python - <<'PY'
          import json
          lines = open("/tmp/decisions.jsonl").read().splitlines()
          record = json.loads(lines[1])
          record["decision"]["score"] = 0
          record["decision"]["action"] = "allow"
          lines[1] = json.dumps(record)
          open("/tmp/tampered.jsonl", "w").write("\n".join(lines) + "\n")
          PY
          if python -m fake_review_detector.cli verify --audit-log /tmp/tampered.jsonl; then
            echo "::error::verify accepted a tampered audit log"
            exit 1
          fi
          echo "tampered log correctly rejected"

      - name: Audit an example domain offline
        run: |
          python -m inboxready deals.example-shop.test \
              --fixture examples/fixtures/failing-sender.json \
              --selector google || test $? -eq 1
        env:
          PYTHONPATH: src
