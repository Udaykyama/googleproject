[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxready"
version = "1.0.0"
description = "Audit a sending domain and message against Google's Gmail bulk sender requirements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["email", "deliverability", "spf", "dkim", "dmarc", "gmail", "rfc8058"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Optional: a native resolver. Without it InboxReady falls back to `dig`.
dns = ["dnspython>=2.4"]

[project.scripts]
inboxready = "inboxready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
